<html lang="es">
<head>

<title>Mi Tienda</title>

<style>
:root{--bg:#EEF3EE;--card:#fff;--ink:#14231B;--mut:#5F7266;--line:#DCE5DD;--g:#1FA855;--gd:#0E7A3B;--gs:#DDF3E4;--y:#FFC93C;--r:#E5484D;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:calc(110px + var(--sab));-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.pr{font-family:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;margin:0}
button,input,textarea,a{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:10;padding:calc(var(--sat) + 14px) 16px 10px;background:rgba(238,243,238,.86);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 12px;color:var(--mut);font-size:14px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.sr{position:relative}
.sr .i{position:absolute;left:14px;top:50%;margin-top:-9px;color:var(--mut)}
#q{width:100%;border:0;background:#fff;border-radius:14px;padding:12px 14px 12px 42px;font-size:16px;box-shadow:0 0 0 1px var(--line) inset}
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--line) inset;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:12px 16px}
.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 var(--line);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.ph{position:relative;aspect-ratio:1;background:var(--gs)}
.ph img,.fr img{width:100%;height:100%;object-fit:cover;display:block}
.noph{width:100%;height:100%;display:grid;place-items:center;font:800 64px "Bricolage Grotesque",sans-serif;color:var(--gd)}
.bd{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#fff}
.bd.s{position:static;display:inline-block}
.bd.ok{background:var(--gs);color:var(--gd)}.bd.low{background:var(--y);color:#4a3600}.bd.out{background:var(--r);color:#fff}
.cb{padding:10px 12px 12px}
.cb h3{font-size:16px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.pr{font-weight:800;font-size:20px;color:var(--gd)}.pr.big{font-size:30px}
.wb{width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 10px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px}
footer button{text-decoration:underline;color:var(--mut)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);z-index:20;display:flex;gap:6px;padding:8px;border-radius:26px;background:rgba(20,35,27,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#bar button{display:flex;align-items:center;gap:5px;color:#fff;padding:11px 11px;border-radius:18px;font-weight:600;font-size:13px}
#bar .main{background:var(--g)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding-bottom:var(--sab);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov.on .sh{transform:none}
.x{position:sticky;top:12px;z-index:3;display:grid;place-items:center;width:34px;height:34px;margin:12px 12px -46px auto;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.fr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:1;background:var(--gs);scrollbar-width:none}
.fr::-webkit-scrollbar{display:none}
.fr>*{flex:none;width:100%;scroll-snap-align:center}
.pad{padding:18px 18px 22px}
.pad h2{font-size:26px;line-height:1.1}
h4{font-size:15px;margin:20px 0 8px;color:var(--mut)}
.ds{margin:12px 0 0;line-height:1.5}
dl{margin:0;background:#fff;border-radius:16px;overflow:hidden}
dl div{display:flex;justify-content:space-between;gap:16px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px}
dl div:last-child{border:0}dt{color:var(--mut)}dd{margin:0;font-weight:600;text-align:right}
.qty{display:inline-flex;align-items:center;background:#fff;border-radius:14px}
.qty button{width:48px;height:44px;font-size:22px}.qty b{min-width:36px;text-align:center}
.pays{display:flex;gap:8px}
.pay{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 8px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line) inset;font-weight:600;font-size:15px}
.pay.on{box-shadow:0 0 0 2px var(--g) inset;background:var(--gs);color:var(--gd)}
#tr{margin-top:8px;font-size:14px;background:#fff;border-radius:14px;padding:12px 14px;white-space:pre-line}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:15px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line) inset;font-weight:700;text-decoration:none;text-align:center}
.btn.wa{background:var(--g);color:#fff;box-shadow:none}.btn.dng{color:var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn{margin-top:12px}
label{display:block;margin-top:14px;font-weight:600;font-size:14px}
label small{font-weight:400;color:var(--mut)}
label input,label textarea{display:block;width:100%;margin-top:6px;padding:12px;border:0;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line) inset;font-size:16px}
label.ck{display:flex;align-items:center;gap:10px}label.ck input{width:22px;height:22px;margin:0}
.th{display:flex;gap:10px;margin-top:14px}
.t{position:relative;width:92px;height:92px;border-radius:16px;overflow:hidden;background:#fff;flex:none}
.t img{width:100%;height:100%;object-fit:cover}
.t button:not(.add){position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.t.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed var(--g);color:var(--gd);font-size:13px;font-weight:600;background:var(--gs)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.gal .t{width:100%;height:auto;aspect-ratio:1}
.gal .noph{font-size:40px}
.pv{display:block;width:62%;margin:14px auto 0;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-90px);z-index:99;background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{background:linear-gradient(#EEF3EE,#E3EDE5) fixed}
header{position:relative;top:auto;z-index:1;padding:calc(var(--sat) + 18px) 18px 22px;color:#fff;border-radius:0 0 34px 34px;background:radial-gradient(circle at 90% 8%,rgba(255,255,255,.2) 0 64px,transparent 65px),radial-gradient(circle at 72% 112%,color-mix(in srgb,var(--acc) 40%,transparent) 0 120px,transparent 121px),linear-gradient(155deg,var(--h1),var(--g2) 62%,var(--g));-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 14px 32px color-mix(in srgb,var(--g2) 30%,transparent)}
.top{display:flex;align-items:center;gap:14px}
#av{width:58px;height:58px;flex:none;border-radius:20px;display:grid;place-items:center;font:800 29px "Bricolage Grotesque",sans-serif;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{font-size:30px;color:#fff}
.tag{margin:3px 0 0;font-size:14px;opacity:.88}
.meta{margin:16px 0 14px;gap:8px}
.meta span{background:rgba(255,255,255,.17);color:#fff;padding:7px 12px;border-radius:99px;font-weight:600;font-size:13px}
#q{border-radius:18px;padding:15px 14px 15px 44px;box-shadow:0 8px 20px rgba(0,0,0,.16)}
#chips{position:sticky;top:0;z-index:9;padding:max(10px,var(--sat)) 16px 8px;background:rgba(238,243,238,.82);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
#chips:empty{display:none}
.chip{padding:9px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chip.on{background:linear-gradient(145deg,var(--g2),var(--h1))}
#grid{gap:16px;padding:16px}
.card{border-radius:28px;box-shadow:0 12px 26px rgba(14,122,59,.11)}
.ph{margin:6px 6px 0;border-radius:22px;overflow:hidden}
.cb{padding:12px 14px 14px}
.bd{display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.noph{background:linear-gradient(135deg,var(--gs),color-mix(in srgb,var(--g) 32%,var(--card)))}
.wb,#fab{background:linear-gradient(145deg,var(--g),var(--g2));box-shadow:0 6px 14px color-mix(in srgb,var(--g) 45%,transparent)}
.fresh .card{animation:up .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.95)}}
#fab{position:fixed;right:16px;bottom:calc(var(--sab) + 18px);z-index:15;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 12px 28px color-mix(in srgb,var(--g2) 50%,transparent)}
#fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--g);animation:ring 2.6s ease-out infinite}
@keyframes ring{to{transform:scale(1.6);opacity:0}}
.sh{background:linear-gradient(#F4F9F5,#E8F1EA)}
.fr{border-radius:0 0 30px 30px}
.pad h2{font-size:28px}
.btn{border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.btn.wa{background:linear-gradient(145deg,var(--g),var(--g2));box-shadow:0 12px 24px color-mix(in srgb,var(--g) 40%,transparent)}
.pay{flex-direction:column;gap:6px;padding:15px 8px;border-radius:18px}
dl,#tr,.qty{box-shadow:0 4px 14px rgba(0,0,0,.05)}
#bar{border-radius:30px;padding:8px 10px;gap:2px}
#bar button{flex-direction:column;gap:3px;min-width:62px;padding:8px 10px;font-size:11px;border-radius:22px}
#bar .main{background:linear-gradient(145deg,var(--g),var(--g2))}
@media(prefers-reduced-motion:reduce){.fresh .card,#fab::after{animation:none!important}}

/* ---- Catálogo estilo lista + modo oscuro ---- */
@media(prefers-color-scheme:dark){:root{--bg:#0B100D;--card:#161D19;--ink:#F1F6F2;--mut:#98A99F;--line:#26312B;--gs:#173626;--gd:#5BE08A;color-scheme:dark}}
body{background:var(--bg)}.sh{background:var(--bg)}
#chips{background:color-mix(in srgb,var(--bg) 82%,transparent)}
.chip,#q,.pay,dl,.qty,.btn,#tr,label input,label textarea,.t{background:var(--card)}
header{padding-bottom:26px;background-size:cover!important;background-position:center!important}
.tag{font-size:15px;line-height:1.35;max-width:46ch}
#grid{display:block;padding:6px 16px}
.it{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border:0}.it:active{opacity:.7}
.th2{width:96px;height:96px;flex:none;border-radius:24px;overflow:hidden;background:var(--gs);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.th2 img{width:100%;height:100%;object-fit:cover;display:block}.th2 .noph{font-size:40px}
.in{flex:1;min-width:0}.in h3{font-size:17px;font-weight:700;line-height:1.2}
.ds2{margin:3px 0 0;color:var(--mut);font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row2{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.plus{width:46px;height:46px;border-radius:16px;background:var(--gs);color:var(--gd);display:grid;place-items:center;flex:none;font:800 18px "Bricolage Grotesque",sans-serif;transition:transform .15s,background .2s}
.plus:active{transform:scale(.86)}.plus:disabled{opacity:.3}.plus.on{background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--g) 45%,transparent)}
#cartbar{position:fixed;left:16px;right:16px;max-width:520px;margin:auto;bottom:calc(var(--sab) + 14px);z-index:15;display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:22px;background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;font-weight:700;box-shadow:0 14px 30px color-mix(in srgb,var(--g2) 50%,transparent);animation:up .35s cubic-bezier(.2,.9,.3,1)}
#cartbar .n{display:grid;place-items:center;min-width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.25)}
#cartbar .tt{margin-left:auto;font:800 19px "Bricolage Grotesque",sans-serif}
.ci{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .th2{width:60px;height:60px;border-radius:16px;box-shadow:none}.ci .in h3{font-size:15px}
.ci .qty button{width:38px;height:38px}.ci .qty b{min-width:26px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 0;font-weight:700}.tot b{font:800 30px "Bricolage Grotesque",sans-serif;color:var(--gd)}

.th2{position:relative}.th2 .bgi{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(12px) saturate(1.2)}.th2 img:not(.bgi){position:relative;object-fit:contain}
.fr img{object-fit:contain}
.ops{display:flex;flex-wrap:wrap;gap:8px}.chip.op{box-shadow:0 0 0 1px var(--line) inset}

.pie{display:block;width:78%;max-width:300px;margin:14px auto 0}.pie text{fill:var(--ink);font:800 17px "Bricolage Grotesque",sans-serif}
.lg{display:grid;gap:8px;margin-top:12px}.lg span{display:flex;align-items:center;gap:10px;font-size:15px}.lg i{width:14px;height:14px;border-radius:5px;flex:none}.lg b{margin-left:auto}
#bar button{min-width:54px;padding:8px 6px}

/* ---- Temas de color ---- */
:root{--g:#10B981;--g2:#047857;--h1:#052E1F;--acc:#FBBF24;--y:var(--acc);--bg:color-mix(in srgb,var(--g) 8%,#fff);--gs:color-mix(in srgb,var(--g) 17%,#fff);--gd:var(--g2);--line:color-mix(in srgb,var(--g) 16%,#E6EAE8)}

header{background:radial-gradient(circle at 92% 6%,rgba(255,255,255,.22) 0 70px,transparent 71px),radial-gradient(circle at 70% 118%,color-mix(in srgb,var(--acc) 45%,transparent) 0 130px,transparent 131px),linear-gradient(155deg,var(--h1),var(--g2) 60%,var(--g))}
.card,.k,.sh{box-shadow:0 8px 24px color-mix(in srgb,var(--g2) 12%,transparent)}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}.swb{width:46px;height:46px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);transition:transform .15s}.swb.on{box-shadow:0 0 0 3px var(--g);transform:scale(1.1)}

<body>
<header>
  <div class="top"><div id="av">M</div><div><h1 id="sn">Mi Tienda</h1><p class="tag" id="tg"></p></div></div>
  <div class="meta" id="meta"></div>
  <div class="sr"><svg class="i" width="18" height="18"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" enterkeyhint="search"></div>
</header>
<div id="chips"></div>
<main id="grid" class="fresh"></main>
<button id="cartbar" hidden></button>
<a id="fab" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp"></a>
<footer><button id="adm">Soy el vendedor</button></footer>
<nav id="bar" hidden>
  <button class="main" data-photos>Fotos</button>
  <button data-new>Producto</button>
  <button data-rep>Control</button>
  <button data-set>Ajustes</button>
  <button data-exp>Publicar</button>
</nav>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div id="toast" role="status"></div>

const S={cart:{},ventas:[],cfg:{nombre:'Mi Tienda',telefono:'',moneda:'C$',pago:{efectivo:true,transferencia:true},datosTransferencia:''},prods:[],admin:false,q:'',cat:'Todo'};
const DB={o:null,open(){return this.o||(this.o=new Promise((ok,no)=>{const r=indexedDB.open('tienda',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},
async get(k){try{const d=await this.open();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}},
async set(k,v){try{const d=await this.open();return await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(1);t.onerror=()=>r(0)})}catch{return 0}}};
const save=async()=>{if(!await DB.set('data',{cfg:S.cfg,prods:S.prods,ventas:S.ventas}))toast('No se pudo guardar en este dispositivo')};
const money=n=>S.cfg.moneda+Number(n||0).toLocaleString('es');
const digits=()=>String(S.cfg.telefono).replace(/\D/g,'').replace(/^0+/,'');
const waOk=()=>digits().length>=10;
const noPhone=()=>{if(S.admin){toast('Falta tu WhatsApp con código de país (ej. +505 8888 8888)');settings()}else toast('Esta tienda aún no tiene WhatsApp configurado')};
const wa=t=>`https://wa.me/${digits()}?text=${encodeURIComponent(t)}`;
const kid=k=>k.split('|')[0],kop=k=>k.includes('|')?k.slice(k.indexOf('|')+1):'';
const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const qOf=id=>Object.entries(S.cart).filter(([k])=>kid(k)==id).reduce((a,[,v])=>a+v,0);
const cartTotal=()=>Object.entries(S.cart).reduce((t,[k,v])=>{const p=S.prods.find(x=>x.id==kid(k));return t+(p?p.precio*v:0)},0);
const saveCart=()=>{try{localStorage.setItem('cart',JSON.stringify(S.cart))}catch{}};
const loadCart=()=>{try{const c=JSON.parse(localStorage.getItem('cart')||'{}');S.cart={};for(const[k,v]of Object.entries(c)){const p=S.prods.find(x=>x.id==kid(k));if(p&&p.stock>0&&v>0)S.cart[k]=Math.min(v,p.stock)}}catch{}};
const parseOpts=p=>(p.opciones||'').split('\n').map(l=>l.split(/:(.+)/)).filter(a=>a[1]).map(a=>({n:a[0].trim(),v:a[1].split(',').map(x=>x.trim()).filter(Boolean)}));
const photoR=p=>p.fotos&&p.fotos[0]?`<img class="bgi" src="${p.fotos[0]}" alt="" aria-hidden="true"><img src="${p.fotos[0]}" alt="${esc(p.nombre)}" loading="lazy">`:`<div class="noph">${esc((p.nombre||'?')[0])}</div>`;
const THEMES={esmeralda:{n:'Esmeralda',g:'#10B981',g2:'#047857',h1:'#052E1F',acc:'#FBBF24'},oceano:{n:'Océano',g:'#0EA5E9',g2:'#0369A1',h1:'#082F49',acc:'#FDBA74'},atardecer:{n:'Atardecer',g:'#F97316',g2:'#C2410C',h1:'#3B1206',acc:'#FDE047'},uva:{n:'Uva',g:'#8B5CF6',g2:'#6D28D9',h1:'#2E1065',acc:'#F9A8D4'},rosa:{n:'Rosa',g:'#EC4899',g2:'#BE185D',h1:'#4A0D2B',acc:'#FDE68A'},whatsapp:{n:'WhatsApp',g:'#25D366',g2:'#128C4B',h1:'#0B3D24',acc:'#FFC93C'}};
const theme=()=>THEMES[S.cfg.tema]||THEMES.esmeralda;
function applyTheme(){const t=theme(),r=document.documentElement.style;['g','g2','h1','acc'].forEach(k=>r.setProperty('--'+k,t[k]));const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.h1}
const payList=()=>Object.keys(S.cfg.pago).filter(k=>S.cfg.pago[k]);
const payName=k=>k=='efectivo'?'Efectivo':'Transferencia';
const stk=p=>p.stock<=0?{k:'out',t:'Agotado'}:p.stock<=3?{k:'low',t:`Quedan ${p.stock}`}:{k:'ok',t:`${p.stock} disponibles`};
const photo=p=>p.fotos&&p.fotos[0]?`<img src="${p.fotos[0]}" alt="${esc(p.nombre)}" loading="lazy">`:`<div class="noph">${esc((p.nombre||'?')[0])}</div>`;

function detail(id){
  const p=S.prods.find(x=>x.id==id);if(!p)return;
  const pays=payList(),s=stk(p);let qty=1,pay=pays[0]||'';const opts=parseOpts(p),sel={};
  const optStr=()=>opts.map((o,i)=>sel[i]!=null?o.n+': '+o.v[sel[i]]:'').filter(Boolean).join(', '),okO=()=>opts.every((o,i)=>sel[i]!=null);
  const specs=(p.specs||'').split('\n').map(l=>l.split(/:(.+)/)).filter(a=>a[1]).map(a=>`<div><dt>${esc(a[0].trim())}</dt><dd>${esc(a[1].trim())}</dd></div>`).join('');
  open(`<div class="fr">${(p.fotos||[]).map(f=>`<img src="${f}" alt="">`).join('')||`<div class="noph">${esc((p.nombre||'?')[0])}</div>`}</div>
  <div class="pad"><h2>${esc(p.nombre)}</h2>
  <div class="row"><b class="pr big">${money(p.precio)}</b><span class="bd s ${s.k}">${bdg(s)}</span></div>
  ${p.descripcion?`<p class="ds">${esc(p.descripcion)}</p>`:''}
  ${specs?`<h4>Especificaciones</h4><dl>${specs}</dl>`:''}
  ${opts.map((o,gi)=>`<h4>${esc(o.n)}</h4><div class="ops">${o.v.map((v,vi)=>`<button class="chip op" data-o="${gi}:${vi}">${esc(v)}</button>`).join('')}</div>`).join('')}
  ${p.stock>0?`<h4>Cantidad</h4><div class="qty"><button data-q="-1" aria-label="Menos">−</button><b id="qv">1</b><button data-q="1" aria-label="Más">+</button></div>`:''}
  ${pays.length?`<h4>Forma de pago</h4><div class="pays">${pays.map(k=>`<button class="pay${k==pay?' on':''}" data-p="${k}">${ic(k=='efectivo'?'cash':'bank')}${payName(k)}</button>`).join('')}</div><div id="tr" hidden></div>`:''}
  ${p.stock>0?`<button class="btn wa" id="${S.admin?'sell':'addc'}">${ic(S.admin?'okc':'plus',22)}${S.admin?'Registrar venta':'Agregar al pedido'}</button>`:''}
  <a id="go" class="btn" target="_blank" rel="noopener">${ic('wa',22)}${p.stock>0?'Consultar disponibilidad':'Avísame cuando llegue'}</a>
  ${S.admin?`<div class="two"><button class="btn" data-edit="${p.id}">${ic('edit')}Editar</button><button class="btn" data-st="${p.id}">${ic('share')}Estado</button></div>`:''}</div>`);
  const upd=()=>{
    const q=$('#qv');if(q)q.textContent=qty;
    const t=$('#tr');if(t){const show=pay=='transferencia'&&S.cfg.datosTransferencia;t.hidden=!show;t.textContent=S.cfg.datosTransferencia}
    sh.querySelectorAll('.pay').forEach(b=>b.classList.toggle('on',b.dataset.p==pay));
    $('#go').href=wa(`Hola 👋 Vi *${p.nombre}* (${money(p.precio)}) en tu tienda.\n`+(p.stock>0?`Quiero ${qty} unidad${qty>1?'es':''}. ¿Está disponible?`:'Veo que está agotado. ¿Cuándo vuelve a llegar?')+(pay?`\nPagaría en ${payName(pay).toLowerCase()}.`:'')+(optStr()?`\nOpción: ${optStr()}`:''));
  };
  sh.onclick=e=>{const q=e.target.closest('[data-q]'),b=e.target.closest('[data-p]');
    const o=e.target.closest('[data-o]');
    if(o){const[gi,vi]=o.dataset.o.split(':');sel[gi]=+vi;o.parentNode.querySelectorAll('.op').forEach(x=>x.classList.toggle('on',x===o))}
    if(e.target.closest('#addc,#sell')){if(!okO())return toast('Elige: '+opts.filter((x,i)=>sel[i]==null).map(x=>x.n).join(', '));
      if(e.target.closest('#sell')){sell(p,qty,pay,optStr());return close()}addCart(p.id,qty,optStr());return close()}
    if(q)qty=Math.min(p.stock,Math.max(1,qty+Number(q.dataset.q)));if(b)pay=b.dataset.p;upd()};
  upd();
}

const fit=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.72))};i.onerror=no;i.src=u});

/* ---- Carrito ---- */
function addCart(id,n=1,opt=''){const p=S.prods.find(x=>x.id==id);if(!p)return;if(qOf(id)+n>p.stock)return toast('Solo hay '+p.stock+' disponibles');
  const k=opt?id+'|'+opt:id;S.cart[k]=(S.cart[k]||0)+n;if(S.cart[k]<=0)delete S.cart[k];saveCart();render();if(n>0)toast('Agregado: '+p.nombre)}
function cartView(){
  if(!cartN()){close();return render()}
  const pays=payList();let pay=pays[0]||'';
  const items=Object.keys(S.cart).map(k=>({k,p:S.prods.find(x=>x.id==kid(k)),o:kop(k),q:S.cart[k]})).filter(i=>i.p);
  open(`<div class="pad"><h2>Tu pedido</h2>
  ${items.map(i=>`<div class="ci"><div class="th2">${photoR(i.p)}</div><div class="in"><h3>${esc(i.p.nombre)}</h3>${i.o?`<p class="ds2">${esc(i.o)}</p>`:''}<b class="pr" style="font-size:16px">${money(i.p.precio*i.q)}</b></div><div class="qty"><button data-cq="${esc(i.k)}:-1" aria-label="Menos">−</button><b>${i.q}</b><button data-cq="${esc(i.k)}:1" aria-label="Más">+</button></div></div>`).join('')}
  <div class="tot"><span>Total</span><b>${money(cartTotal())}</b></div>
  <label>Tu nombre <small>opcional</small><input id="cn" autocomplete="name"></label>
  ${pays.length?`<h4>Forma de pago</h4><div class="pays">${pays.map(k=>`<button class="pay${k==pay?' on':''}" data-p="${k}">${ic(k=='efectivo'?'cash':'bank')}${payName(k)}</button>`).join('')}</div>`:''}
  <a id="send" class="btn wa" target="_blank" rel="noopener">${ic('wa',22)}Enviar pedido por WhatsApp</a>
  <button class="btn dng" data-clear>Vaciar pedido</button></div>`);
  const upd=()=>{const nm=($('#cn')||{}).value?.trim();
    $('#send').href=wa(`Hola 👋 Quiero hacer este pedido en *${S.cfg.nombre}*:\n\n`+items.map(i=>`• ${i.q} × ${i.p.nombre}${i.o?' ('+i.o+')':''} — ${money(i.p.precio*i.q)}`).join('\n')+`\n\n*Total: ${money(cartTotal())}*`+(pay?`\nPago: ${payName(pay).toLowerCase()}`:'')+(nm?`\nNombre: ${nm}`:''))};
  sh.onclick=e=>{const q=e.target.closest('[data-cq]'),b=e.target.closest('[data-p]');
    if(q){const c=q.dataset.cq,j=c.lastIndexOf(':'),k=c.slice(0,j),d=+c.slice(j+1),p=S.prods.find(x=>x.id==kid(k));
      if(d>0&&qOf(p.id)>=p.stock)return toast('Solo hay '+p.stock+' disponibles');
      S.cart[k]=(S.cart[k]||0)+d;if(S.cart[k]<=0)delete S.cart[k];saveCart();render();return cartView()}
    if(e.target.closest('[data-clear]')){S.cart={};saveCart();close();return render()}
    if(b){pay=b.dataset.p;sh.querySelectorAll('.pay').forEach(x=>x.classList.toggle('on',x.dataset.p==pay));upd()}};
  sh.oninput=upd;upd();
}

/* ---- Ventas y control ---- */
async function sell(p,q,pay,o){q=Math.min(q,p.stock);if(q<1)return toast('No hay disponibles');p.stock-=q;
  S.ventas.unshift({id:'v'+Date.now().toString(36),t:Date.now(),pid:p.id,nombre:p.nombre,cat:p.categoria||'Sin categoría',q,precio:p.precio,costo:p.costo||0,pago:pay,op:o||''});
  await save();render();toast('Venta registrada: '+q+' × '+p.nombre)}
const COL=['#25D366','#FFC93C','#3B82F6','#E5484D','#A855F7','#F97316','#14B8A6','#EC4899'];
function pie(d,fmt){const T=d.reduce((a,b)=>a+b.n,0);if(!T)return '<p class="empty" style="padding:24px 0">Todavía no hay datos aquí.</p>';
  let a0=-Math.PI/2;const R=92,r=56,P=(a,k)=>(100+k*Math.cos(a)).toFixed(2)+' '+(100+k*Math.sin(a)).toFixed(2);
  const arcs=d.map((x,i)=>{const f=x.n/T,a1=a0+f*2*Math.PI-(f>.9999?.0001:0),big=f>.5?1:0;
    const t=`<path d="M${P(a0,R)}A${R} ${R} 0 ${big} 1 ${P(a1,R)}L${P(a1,r)}A${r} ${r} 0 ${big} 0 ${P(a0,r)}Z" fill="${COL[i%8]}" stroke="var(--bg)" stroke-width="2"/>`;a0+=f*2*Math.PI;return t}).join('');
  return `<svg viewBox="0 0 200 200" class="pie" role="img" aria-label="Gráfico de pastel por categoría">${arcs}<text x="100" y="106" text-anchor="middle">${fmt(T)}</text></svg>
  <div class="lg">${d.map((x,i)=>`<span><i style="background:${COL[i%8]}"></i>${esc(x.k)}<b>${fmt(x.n)} · ${Math.round(x.n/T*100)}%</b></span>`).join('')}</div>`}
function report(){
  const per=S.per||'mes',vw=S.vw||'v',now=new Date();
  const t0={hoy:new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),'7d':Date.now()-6048e5,mes:new Date(now.getFullYear(),now.getMonth(),1).getTime(),todo:0}[per];
  const vs=S.ventas.filter(v=>v.t>=t0),cat={},g=k=>cat[k]||(cat[k]={v:0,u:0,q:0});
  vs.forEach(v=>{const c=g(v.cat);c.v+=v.q*v.precio;c.u+=v.q});S.prods.forEach(p=>{g(p.categoria||'Sin categoría').q+=p.stock});
  const tot=vs.reduce((a,v)=>a+v.q*v.precio,0),gan=vs.reduce((a,v)=>a+v.q*(v.precio-v.costo),0),un=vs.reduce((a,v)=>a+v.q,0),left=S.prods.reduce((a,p)=>a+p.stock,0),hasC=vs.some(v=>v.costo>0);
  const rows=Object.entries(cat),data=rows.map(([k,c])=>({k,n:vw=='v'?c.v:c.q})).filter(d=>d.n>0).sort((a,b)=>b.n-a.n);
  const ch=(a,v,l,cur)=>`<button class="chip${a==cur?' on':''}" ${v}="${a}">${l}</button>`;
  const fd=t=>new Date(t).toLocaleString('es',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  open(`<div class="pad"><h2>Control de ventas</h2>
  <div class="ops" style="margin-top:12px">${[['hoy','Hoy'],['7d','7 días'],['mes','Este mes'],['todo','Todo']].map(([a,l])=>ch(a,'data-per',l,per)).join('')}</div>
  <div class="kp"><div class="k"><small>Vendido</small><b>${money(tot)}</b></div><div class="k"><small>Unidades vendidas</small><b>${un}</b></div><div class="k"><small>Ganancia</small><b>${hasC?money(gan):'—'}</b></div><div class="k"><small>Me quedan</small><b>${left} u.</b></div></div>
  <div class="ops" style="margin-top:18px">${ch('v','data-vw','Lo que vendí',vw)}${ch('q','data-vw','Lo que me queda',vw)}</div>
  ${pie(data,vw=='v'?money:n=>n+' u.')}
  <h4>Por categoría</h4><dl>${rows.map(([k,c])=>`<div><dt>${esc(k)}</dt><dd>${c.u} vend. · ${money(c.v)} · quedan ${c.q}</dd></div>`).join('')||'<div><dt>Sin datos</dt><dd></dd></div>'}</dl>
  <h4>Historial</h4>${vs.slice(0,40).map(v=>`<div class="ci"><div class="in"><h3>${v.q} × ${esc(v.nombre)}</h3><p class="ds2">${esc(v.op?v.op+' · ':'')}${esc(v.pago||'')} · ${fd(v.t)}</p></div><b class="pr" style="font-size:16px">${money(v.q*v.precio)}</b><button class="plus" style="width:36px;height:36px;border-radius:12px" data-dv="${v.id}" aria-label="Anular venta">${ic('x',14)}</button></div>`).join('')||'<p class="ds">Aún no registras ventas. Abre un producto y toca “Registrar venta”.</p>'}
  <button class="btn" data-csv>${ic('download')}Descargar ventas (Excel/CSV)</button></div>`);
  sh.onclick=async e=>{const a=e.target.closest('[data-per]'),b=e.target.closest('[data-vw]'),d=e.target.closest('[data-dv]');
    if(a){S.per=a.dataset.per;return report()}if(b){S.vw=b.dataset.vw;return report()}
    if(d&&confirm('¿Anular esta venta? Los productos vuelven a tu inventario.')){const v=S.ventas.find(x=>x.id==d.dataset.dv),p=v&&S.prods.find(x=>x.id==v.pid);if(p)p.stock+=v.q;S.ventas=S.ventas.filter(x=>x!==v);await save();render();return report()}
    if(e.target.closest('[data-csv]')){const q=t=>'"'+String(t).replace(/"/g,'""')+'"';
      const c='\ufeffFecha,Producto,Categoría,Opción,Cantidad,Precio,Total,Costo,Ganancia,Pago\n'+S.ventas.map(v=>[new Date(v.t).toLocaleString('es'),v.nombre,v.cat,v.op,v.q,v.precio,v.q*v.precio,v.costo,v.q*(v.precio-v.costo),v.pago].map(q).join(',')).join('\n');
      const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));l.download='ventas.csv';l.click()}}}

/* ---- Eventos ---- */
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let t;
  if(e.target===ov||g('[data-x]'))return close();
  if(g('[data-rep]'))return report();
  if(g('#fab,#go,#send')&&!waOk()){e.preventDefault();return noPhone()}
  if(t=g('[data-wa]')){if(!waOk())return noPhone();e.stopPropagation();const p=S.prods.find(x=>x.id==t.dataset.wa);
    window.open(wa(`Hola 👋 Vi *${p.nombre}* (${money(p.precio)}) en tu tienda. ¿Está disponible?`),'_blank');return}
  if(t=g('[data-add]')){e.stopPropagation();const p=S.prods.find(x=>x.id==t.dataset.add);return p&&parseOpts(p).length?detail(p.id):addCart(t.dataset.add)}
  if(g('#cartbar'))return cartView();
  if(t=g('[data-open]'))return detail(t.dataset.open);
  if(t=g('[data-c]')){S.cat=t.dataset.c;return render()}
  if(g('[data-photos]')){S.fromGal=true;return gallery()}
  if(g('[data-new]'))return edit();
  if(t=g('[data-edit]'))return edit(t.dataset.edit);
  if(g('[data-set]'))return settings();
  if(g('[data-exp]'))return exportJ();
  if(t=g('[data-st]'))return status(t.dataset.st);
  if(t=g('[data-del]')){if(confirm('¿Eliminar este producto?')){S.prods=S.prods.filter(x=>x.id!=t.dataset.del);save();render();close();toast('Producto eliminado')}return}
  if(g('#adm')){S.admin=!S.admin;render();if(S.admin&&!S.cfg.telefono)settings()}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});

(async()=>{
  const local=await DB.get('data');
  if(local){S.cfg={...S.cfg,...local.cfg};S.prods=local.prods||[];S.ventas=local.ventas||[];S.admin=true}
  else try{const r=await fetch('productos.json?v='+Date.now());const d=await r.json();S.cfg={...S.cfg,...d.cfg};S.prods=d.prods||[]}catch{}
  loadCart();render();setTimeout(()=>$('#grid').classList.remove('fresh'),1600);
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
